# GitHub's private vulnerability reporting exists only on public repositories. A private repository drops this
# contact link and says in SECURITY.md where a report goes instead.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/{{owner}}/{{slug}}/security/advisories/new
    about: Report it privately instead of opening a public issue. SECURITY.md has the details.
